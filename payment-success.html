<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع ناجح - لحومنا</title>
    <link rel="icon" href="images/logo.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Almarai', sans-serif; background: #fff; color: #000; text-align: center; padding: 50px; }
        .icon { font-size: 80px; color: #DA4900; margin-bottom: 20px; }
        h1 { font-size: 2rem; margin-bottom: 20px; }
        p { font-size: 1.1rem; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 12px 30px; background: #DA4900; color: #fff; border-radius: 25px; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn:hover { background: #FF7A38; }
    </style>
</head>
<body>
    <div class="icon"><i class="fas fa-check-circle"></i></div>
    <h1>تم الدفع بنجاح!</h1>
    <p>شكراً لك على طلبك. سيتم تحديث حالته قريباً.</p>
  

    <script>
        // Optional: Verify payment by calling your backend
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        if (orderId) {
            fetch(`/api/verify-mpgs-payment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: orderId })
            })
            .then(res => res.json())
            .then(data => {
                if (!data.paid) {
                    document.querySelector('h1').textContent = 'فشل التحقق من الدفع!';
                    document.querySelector('p').textContent = 'يرجى التواصل مع الدعم.';
                }
            });
        }
    </script>
</body>
</html>
